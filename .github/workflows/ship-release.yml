name: ship-release
# Shared shipping path for every release kind: attest the APK+SBOM+provenance,
# write the checksum manifest, compose the release notes, and `gh release
# create`. Currently called by release-tag (tag-based general releases); the
# sync-upstream path produces CI artifacts only and never reaches this file.
#
# This is a called workflow — not steps in the caller — because the shipping
# path is identical for every release kind; the only differences (tag format,
# title, the header block of the notes) arrive as inputs. A step-level
# duplication would drift the first time only one caller is updated.
#
# A called workflow runs its jobs on a fresh runner, so the caller uploads
# the APK, SBOM and provenance as one artifact (see artifact_name); this job
# downloads it, attests the exact bytes it is about to publish, and creates
# the release. The attestation is minted here — not in the caller — so the
# statement covers the bytes the release actually ships.
on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to create (e.g. v1.2.3); sync builds are CI artifacts, not releases'
        required: true
        type: string
      release_title:
        description: 'GitHub Release title'
        required: true
        type: string
      notes_header:
        description: 'First line of the release notes (the ### header)'
        required: true
        type: string
      notes_extra:
        description: >
          Markdown bullet lines after notes_header (e.g. version and build
          channel for tag releases). Callers pass this with |- so no trailing
          blank line is added.
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'Name of the artifact the caller uploaded holding the APK, SBOM and provenance'
        required: true
        type: string
      prerelease:
        description: 'Create the release as a GitHub pre-release; stable promotion is a separate step'
        required: false
        type: boolean
        default: true
      apk_path:
        description: 'Path of the aligned APK inside the downloaded artifact'
        required: false
        type: string
        default: 'app-release-aligned.apk'
      sbom_path:
        description: 'Path of the SPDX SBOM inside the downloaded artifact'
        required: false
        type: string
        default: 'sbom.spdx.json'
      provenance_path:
        description: 'Path of the build provenance JSON inside the downloaded artifact'
        required: false
        type: string
        default: 'provenance.json'
      attestation_bundle_name:
        description: 'File name of the attestation bundle release asset'
        required: false
        type: string
        default: 'apk.attestation.json'

jobs:
  ship:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # GitHub Release creation
      attestations: write  # mint the APK+SBOM+provenance attestation
      id-token: write
      actions: write       # dispatch verify-release after publication
    steps:
      # Block egress; the allow-list is the release half of the release-tag
      # map: checkout (github.com, codeload), artifact download
      # (actions hosts, blob storage), the release API and asset upload
      # (api.github.com, uploads.github.com, cafe.github.com — all three hit
      # by `gh release create`), and the Sigstore Public Good instance the
      # attest step signs through (fulcio/rekor).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com
            api.github.com
            codeload.github.com
            objects.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            uploads.github.com
            cafe.github.com
            fulcio.sigstore.dev
            rekor.sigstore.dev

      # Checked out for ./.github/actions/attest-inputs below.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the shipping inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ship/

      # Fail fast on a layout regression: the callers must upload a flat
      # artifact (APK, SBOM and provenance at the root). A multi-path upload
      # preserves directory structure and once buried the APK under
      # launcher/app/build/..., which let the attest step below mint a
      # 2-subject statement missing the APK before 'Publish Release with
      # Checksums' died. Verify all three subjects before anything signs.
      - name: Verify the shipping inputs
        env:
          APK_PATH: ${{ inputs.apk_path }}
          SBOM_PATH: ${{ inputs.sbom_path }}
          PROV_PATH: ${{ inputs.provenance_path }}
        run: |
          set -euo pipefail
          missing=0
          for f in "ship/$APK_PATH" "ship/$SBOM_PATH" "ship/$PROV_PATH"; do
            if [ ! -f "$f" ]; then echo "::error::missing shipping input: $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "--- artifact layout (ship/) ---"
            find ship -type f | head -30
            exit 1
          fi

      # Attest the shipping APK itself, not just its inputs (see
      # build-launcher-apk.yml for why the APK gets its own statement), plus
      # the SBOM and the build provenance, in one statement. Minted here so
      # the statement covers the exact bytes the release below publishes.
      - name: Attest the APK, SBOM and provenance
        uses: ./.github/actions/attest-inputs
        with:
          bundle-output: ship/${{ inputs.attestation_bundle_name }}
          paths: |
            ship/${{ inputs.apk_path }}
            ship/${{ inputs.sbom_path }}
            ship/${{ inputs.provenance_path }}

      # The release contract publishes the licence, native notices, and the
      # public signing certificate next to the APK. They are checked out from
      # the same tag, so the notes and the certificate asset describe the
      # source the release claims.
      - name: Add license, notices, and release certificate
        run: |
          set -euo pipefail
          cp LICENSE ship/LICENSE
          cp launcher/THIRDPARTY_NATIVE.md ship/THIRDPARTY_NATIVE.md
          cp provenance/release-cert.pem ship/release-cert.pem
          cp provenance/release-cert.sha256 ship/release-cert.sha256

      - name: Publish Release with Checksums
        working-directory: ship
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          NOTES_HEADER: ${{ inputs.notes_header }}
          NOTES_EXTRA: ${{ inputs.notes_extra }}
          APK_PATH: ${{ inputs.apk_path }}
          SBOM_PATH: ${{ inputs.sbom_path }}
          PROV_PATH: ${{ inputs.provenance_path }}
          BUNDLE_NAME: ${{ inputs.attestation_bundle_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BASENAME="$(basename "$APK_PATH")"
          echo "$SHA  $APK_BASENAME" > "$APK_PATH.sha256"
          CERT_FP="$(tr -d '[:space:]' < release-cert.sha256 | tr 'A-F' 'a-f')"
          [ -n "$CERT_FP" ] || { echo "release-cert.sha256 is empty" >&2; exit 1; }
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/tree/$TAG_NAME"
          # Notes are printed with printf (not a heredoc) so the
          # caller-supplied header/extra lines are reproduced literally —
          # backticks and all — instead of being reinterpreted by the shell.
          {
            printf '%s\n' "$NOTES_HEADER"
            printf '%s\n' "$NOTES_EXTRA"
            printf '\n### 📲 Install and upgrade\n'
            printf 'Download `%s` and open it on the device. The APK is `arm64-v8a` and requires Android 9 (API 28) or newer. Allow installs from unknown sources if prompted.\n\n' "$APK_BASENAME"
            printf '**First contract release / old installs:** this release installs as `com.bepinex.android`. Uninstall `com.bepinex.android.release` and any old debug install at `com.bepinex.android` once. The package and signing identity changed, so Android cannot update them in place; app data is not migrated.\n\n'
            printf '**Later releases:** install over the previous release signed by the same key; updates preserve app data.\n'
            printf '\n### ✅ Verified device matrix\n'
            printf '| Device class | Android | Unity | Game | Result |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '| Snapdragon 8 Gen 3, arm64 | Android 15+ | Unity 6000 | The Tower | Launcher and mods pass; production RTDB path is a known crash |\n'
            printf '| Snapdragon 8 Gen 3, arm64 | Android 15+ | Unity 6000 | Unlock! | Pass |\n'
            printf '| Snapdragon 8 Gen 2, arm64 | Android 15+ | Unity 2022.3 | Revolution Idle | Pass |\n'
            printf '\nThe matrix records the devices used for release verification, not a guarantee for every title. Device results are recorded before stable promotion.\n'
            printf '\n### ⚠️ Known issues\n'
            printf -- '- **The Tower:** the production Firebase RTDB path aborts in `DeleteInternal` on the pinned Firebase C++ SDK. See [`docs/release-crash-investigation.md`](%s/docs/release-crash-investigation.md).\n' "$SOURCE_URL"
            printf '\n### 🔒 Checksums (SHA-256)\n```\n'
            cat "$APK_PATH.sha256"
            # Basenames, not the caller's staging paths: a user who downloads
            # the assets runs `sha256sum -c` in one flat directory.
            sha256sum "$(basename "$SBOM_PATH")" "$(basename "$PROV_PATH")" "$(basename "$BUNDLE_NAME")" \
              LICENSE THIRDPARTY_NATIVE.md release-cert.pem release-cert.sha256
            printf '```\n'
            printf '\n### 📦 SBOM\n`%s` is the SPDX 2.3 source SBOM for this release.\n' "$(basename "$SBOM_PATH")"
            printf '\n### 🧾 Build provenance\n`%s` records what this release was built from: the upstream pin, the patched-tree hash the replay produced, the patch files and the SDK version. It is covered by the attestation below.\n' "$(basename "$PROV_PATH")"
            printf '\n### 🔏 Attestation\n`%s` binds this repository, this workflow run and this commit to the APK, SBOM, and provenance bytes above. Verify with:\n```\ngh attestation verify %s --repo %s\n```\n' "$BUNDLE_NAME" "$APK_BASENAME" "$GITHUB_REPOSITORY"
            printf '\n### 🧾 Signing certificate\nSHA-256 fingerprint:\n```\n%s\n```\n`release-cert.pem` is the public certificate; `release-cert.sha256` is the fingerprint file. The same fingerprint is committed at `provenance/release-cert.sha256`. Compare after downloading with:\n```\napksigner verify --print-certs %s\n```\n' "$CERT_FP" "$APK_BASENAME"
            printf '\n### ⚖️ License and source\nBepInEx Android is licensed under GPL-3.0; see `LICENSE`. BepInEx itself is LGPL-2.1. Third-party native binaries and their licenses are listed in `THIRDPARTY_NATIVE.md`.\n\nCorresponding source for this tag: %s\n' "$SOURCE_URL"
            printf '\n- **Build Timestamp:** %s\n' "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > ../release-notes.md
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          # --verify-tag makes the tag the only way to create this release: if
          # the tag is missing, gh fails instead of creating it implicitly.
          gh release create "$TAG_NAME" \
            "$APK_PATH" "$APK_PATH.sha256" "$SBOM_PATH" "$PROV_PATH" "$BUNDLE_NAME" \
            LICENSE THIRDPARTY_NATIVE.md release-cert.pem release-cert.sha256 \
            --title "$RELEASE_TITLE" \
            --notes-file ../release-notes.md \
            --verify-tag \
            "${EXTRA_ARGS[@]}"

      # A release created with GITHUB_TOKEN does not emit a release event that
      # starts another workflow (workflow_dispatch and repository_dispatch are
      # the exceptions). Dispatch the consumer verifier explicitly so every
      # published tag release is still checked automatically.
      - name: Dispatch consumer verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: gh workflow run verify-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
