name: build-native-deps
on:
  workflow_dispatch:
  push:
    paths:
      # The pins now live in provenance/*.env, so a pin change is what should
      # rebuild the hook engines. third_party/** was dropped when the sources
      # stopped being read from the submodules; keeping it would trigger a build
      # on a gitlink bump that no longer affects what is compiled.
      - 'provenance/dobby.env'
      - 'provenance/lsplant.env'
      - 'references/dobby-android-log-include.patch'
      - 'scripts/build_native_deps.sh'
      - 'scripts/check_elf_alignment.sh'
      - 'provenance/SOURCES.md'
jobs:
  build:
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on 2026-10-19,
    # and an NDK/C++ toolchain bump must never be silent here.
    runs-on: ubuntu-24.04
    # Declaring this block replaces the token's scopes entirely, so `contents: read`
    # is restated rather than assumed - see the same note in fetch-runtime.yml,
    # where omitting it broke checkout.
    permissions:
      contents: read
      # actions/attest-build-provenance only.
      attestations: write
      id-token: write
    steps:
      # Egress pilot: blocks with an explicit allow-list measured from three
      # audit-mode runs (38359991924, 38357879637, 38356171585): checkout and
      # upstream clones (github.com, codeload on some runs), the NDK install
      # (dl.google.com via sdkmanager), the artifact blob storage the upload
      # step writes to (*.blob.core.windows.net), and the Sigstore Public
      # Good instance the attest step signs through (fulcio/rekor — without
      # them the attest degrades to the fallback bundle even on a public
      # repo, see build-bepinex.yml). No dotnet/nuget/gradle hosts: this job
      # compiles only C++ via the NDK. Rollback is one line back to audit.
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com
            api.github.com
            codeload.github.com
            objects.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            dl.google.com
            fulcio.sigstore.dev
            rekor.sigstore.dev

      # No submodules: build_native_deps.sh clones dobby and Pine from the pins in
      # provenance/dobby.env and provenance/lsplant.env, and asserts each clone landed
      # on the pinned commit before compiling anything.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;30.0.16248370" "cmake;3.30.3"

      - name: Build dobby + Pine from source
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/launcher/app/src/main/ndk-placeholder
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          ./scripts/build_native_deps.sh

      - name: Check 16KB page alignment
        # Only the two libraries this job builds. The other nine .so are staged
        # by other producers and checked against the manifest by
        # verify-prebuilts.sh, which also asserts no unlisted binary is shipped.
        # Re-checking them here cost a readelf per file and reported nothing
        # this job could act on.
        run: |
          ./scripts/check_elf_alignment.sh \
            launcher/app/src/main/jniLibs/arm64-v8a/libdobby.so \
            launcher/app/src/main/jniLibs/arm64-v8a/liblsplant.so

      - name: Record checksums
        run: |
          cd launcher/app/src/main/jniLibs/arm64-v8a
          sha256sum libdobby.so liblsplant.so > "$GITHUB_WORKSPACE/native-deps.sha256"
          cat "$GITHUB_WORKSPACE/native-deps.sha256"

      # Attest before upload, not after: the consumer's gate checks that these
      # exact bytes carry an attestation naming this run and commit, so a bundle
      # emitted after the artifact left the job would describe nothing the
      # consumer can verify.
      #
      # attestations: write is required, and without it this step produces no
      # statement and the consumer fails closed on libdobby.so and liblsplant.so.
      # That is deliberate - a missing attestation must stop the shipping path,
      # not be logged and stepped over.
      - name: Attest the hook engines
        uses: ./.github/actions/attest-inputs
        with:
          bundle-output: native-deps.attestation.json
          paths: |
            launcher/app/src/main/jniLibs/arm64-v8a/libdobby.so
            launcher/app/src/main/jniLibs/arm64-v8a/liblsplant.so

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-deps
          path: |
            launcher/app/src/main/jniLibs/arm64-v8a/libdobby.so
            launcher/app/src/main/jniLibs/arm64-v8a/liblsplant.so
            native-deps.sha256
            native-deps.attestation.json
          retention-days: 1